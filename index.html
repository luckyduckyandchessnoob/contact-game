<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact! - daily word game</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- google fonts import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- opening screen/give a clue screen -->
    <div id="header">
        <h1 id="secret-word"></h1>
    </div>
    <div id="contact-container">
        <p id="result"></p>
        <button id="contact-btn" onclick="activateContact()">Contact!</button>
    </div>
    <!-- guess a word screen -->
    <div class="guess-container" id="guess-1">
        <p id="guess-text-1">Player 1, enter your guess:</p>
        <input type="password" class="guess-input" id="guess-input-1">
        <button id="submit-btn-1" class="submit-btn">Submit</button>
    </div>
    <div class="guess-container" id="guess-2">
        <p id="guess-text-2">Player 2, enter your guess:</p>
        <input type="password" class="guess-input" id="guess-input-2">
        <button id="submit-btn-2" class="submit-btn">Submit</button>
    </div>
    <div id="results-container">
        <p id="results-key">
            Results key:
            <br>🎉: word was revealed
            <br>✅: guesses matched
            <br>❌: guesses did not match
        </p>
        <button id="copy-btn" onclick="copyResults()">Copy Results</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
